limit_req_zone $binary_remote_addr zone=iz_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=iz_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name izplay.tv www.izplay.tv web.izplay.tv;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.izplay.tv;

    ssl_certificate /etc/letsencrypt/live/izplay.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/izplay.tv/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/izplay-player;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Web Player oficial em https://web.izplay.tv/
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # Compatibilidade com o caminho usado no preview e no PWA.
    location = /player {
        return 301 /player/;
    }
    location /player/ {
        alias /var/www/izplay-player/;
        try_files $uri $uri/ /player/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }
    location = /player/manifest.json {
        alias /var/www/izplay-player/manifest.json;
        add_header Cache-Control "no-cache" always;
    }
    location = /player/service-worker.js {
        alias /var/www/izplay-player/service-worker.js;
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/player/" always;
    }
    location /player/assets/ {
        alias /var/www/izplay-player/assets/;
        expires 7d;
    }
    location /player/icons/ {
        alias /var/www/izplay-player/icons/;
        expires 7d;
    }
    location /player/vendor/ {
        alias /var/www/izplay-player/vendor/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /gateway/ {
        limit_req zone=iz_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /control/ {
        limit_req zone=iz_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /video-gateway/ {
        limit_req zone=iz_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:4100/;
        proxy_http_version 1.1;
        proxy_set_header X-IZ-Gateway-Token "__GATEWAY_TOKEN__";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /video-gateway;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /protected-gateway/ {
        limit_req zone=iz_api burst=80 nodelay;
        proxy_pass http://__WIREGUARD_GATEWAY_IP__:4100/;
        proxy_http_version 1.1;
        proxy_set_header X-IZ-Gateway-Token "__GATEWAY_TOKEN__";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /protected-gateway;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name izplay.tv www.izplay.tv;

    ssl_certificate /etc/letsencrypt/live/izplay.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/izplay.tv/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/izplay-site;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Landing page institucional permanece em /
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Web Player v1.3
    location = /player {
        return 301 /player/;
    }
    location = /app-v6 {
        return 301 /player/;
    }
    location /player/ {
        alias /var/www/izplay-player/;
        try_files $uri $uri/ /player/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location = /player/manifest.json {
        alias /var/www/izplay-player/manifest.json;
        add_header Cache-Control "no-cache" always;
    }
    location = /player/service-worker.js {
        alias /var/www/izplay-player/service-worker.js;
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/player/" always;
    }
    location /player/assets/ {
        alias /var/www/izplay-player/assets/;
        expires 7d;
    }
    location /player/icons/ {
        alias /var/www/izplay-player/icons/;
        expires 7d;
    }
    location /player/vendor/ {
        alias /var/www/izplay-player/vendor/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gateway Xtream/API existente.
    location /gateway/ {
        limit_req zone=iz_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Painel e telemetria. A interface administrativa pode ser restringida
    # adicionalmente por Cloudflare Access.
    location /control/ {
        limit_req zone=iz_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /control/api/login {
        limit_req zone=iz_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000/api/login;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Gateway de mídia. O segredo é adicionado no servidor e nunca enviado
    # para o JavaScript do cliente.
    location /video-gateway/ {
        limit_req zone=iz_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:4100/;
        proxy_http_version 1.1;
        proxy_set_header X-IZ-Gateway-Token "__GATEWAY_TOKEN__";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /video-gateway;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Gateway alcançado pela rede WireGuard. Substitua o IP pelo peer privado.
    location /protected-gateway/ {
        limit_req zone=iz_api burst=80 nodelay;
        proxy_pass http://__WIREGUARD_GATEWAY_IP__:4100/;
        proxy_http_version 1.1;
        proxy_set_header X-IZ-Gateway-Token "__GATEWAY_TOKEN__";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /protected-gateway;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
